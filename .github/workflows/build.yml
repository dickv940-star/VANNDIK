name: Build VANNDIK

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Check Cloudflare Pages Functions syntax
        run: find functions -type f -name '*.js' -print0 | xargs -0 -n1 node --check
      - name: Build Astro site
        run: npm run build
